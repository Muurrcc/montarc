schema = 1
id = "montarc"
name = "Montarc"
version = "1.1.1"
api = "0.1"
description = "Bright and colorful. Soft shadows, colored torches, real water, wind in the grass, and own look for the Nether and the End."
authors = ["Montarc"]
license = "MIT"
shared = ["common.wgsl"]

[sky]
file = "sky.wgsl"
name = "Sky"

[material]
file = "material.wgsl"
name = "Terrain"
fog = false

[vertex]
file = "vertex.wgsl"

[shadow]
resolution = 2048
distance = 128.0
solid_materials = [4]

[reflection]
option = "reflections"

[[post]]
file = "post/bloom_prefilter.wgsl"
name = "Bloom: bright parts"
output = "bloom_a"
scale = 0.25

[[post]]
file = "post/bloom_blur_h.wgsl"
name = "Bloom: blur H"
output = "bloom_b"
scale = 0.25

[[post]]
file = "post/bloom_blur_v.wgsl"
name = "Bloom: blur V"
output = "bloom_c"
scale = 0.25

[[post]]
file = "post/composite.wgsl"
name = "Colour"

[[post]]
file = "post/fxaa.wgsl"
name = "Anti-aliasing"

[budget]
gpu_ms = 3.0

# Wind: short plants, the lower and upper halves of tall plants, leaves.
[[materials]]
id = 1
sprites = ["block/short_grass", "block/fern", "block/dead_bush", "block/dandelion", "block/poppy", "block/blue_orchid", "block/allium", "block/azure_bluet", "block/red_tulip", "block/orange_tulip", "block/white_tulip", "block/pink_tulip", "block/oxeye_daisy", "block/cornflower", "block/lily_of_the_valley", "block/torchflower", "block/*_sapling", "block/wheat_stage*", "block/carrots_stage*", "block/potatoes_stage*", "block/beetroots_stage*", "block/sugar_cane", "block/seagrass", "block/kelp", "block/kelp_plant"]

[[materials]]
id = 2
sprites = ["block/tall_grass_bottom", "block/large_fern_bottom", "block/sunflower_bottom", "block/lilac_bottom", "block/rose_bush_bottom", "block/peony_bottom", "block/tall_seagrass_bottom"]

[[materials]]
id = 3
sprites = ["block/tall_grass_top", "block/large_fern_top", "block/sunflower_top", "block/sunflower_front", "block/sunflower_back", "block/lilac_top", "block/rose_bush_top", "block/peony_top", "block/tall_seagrass_top"]

[[materials]]
id = 4
sprites = ["block/*_leaves"]

# Coloured block light. Anything not listed shines torch-warm.
[[lights]]
color = [0.25, 0.75, 1.0]
blocks = ["soul_*"]

[[lights]]
color = [1.0, 0.18, 0.08]
blocks = ["redstone_torch", "redstone_wall_torch", "redstone_block", "redstone_lamp", "redstone_ore", "deepslate_redstone_ore"]

[[lights]]
color = [1.0, 0.38, 0.1]
blocks = ["lava", "magma_block", "fire", "jack_o_lantern"]

[[lights]]
color = [1.0, 0.85, 0.5]
blocks = ["glowstone", "shroomlight", "ochre_froglight", "copper_bulb", "exposed_copper_bulb", "weathered_copper_bulb", "oxidized_copper_bulb"]

[[lights]]
color = [0.65, 0.95, 1.0]
blocks = ["sea_lantern", "beacon", "conduit"]

[[lights]]
color = [0.85, 0.8, 1.0]
blocks = ["end_rod"]

[[lights]]
color = [0.7, 0.4, 1.0]
blocks = ["amethyst_cluster", "*_amethyst_bud", "crying_obsidian", "nether_portal"]

[[lights]]
color = [0.45, 1.0, 0.5]
blocks = ["verdant_froglight"]

[[lights]]
color = [1.0, 0.6, 0.9]
blocks = ["pearlescent_froglight"]

[[lights]]
color = [0.7, 1.0, 0.8]
blocks = ["glow_lichen"]

[[lights]]
color = [1.0, 0.7, 0.3]
blocks = ["cave_vines", "cave_vines_plant"]

[[lights]]
color = [0.15, 0.65, 0.95]
blocks = ["sculk_sensor", "calibrated_sculk_sensor", "sculk_catalyst", "sculk_shrieker"]

[[pages]]
id = "main"
name = "Montarc"
items = ["page:lighting", "page:water", "page:atmosphere", "page:look"]
columns = 1

[[pages]]
id = "lighting"
name = "Light and shadow"
description = "Sun, shadows, torches."
items = ["shadows", "shadow_samples", "shadow_softness", "shadow_bias", "sun_strength", "ambient_strength", "block_light_strength", "colored_lights"]

[[pages]]
id = "water"
name = "Water"
description = "Reflections, waves, clarity."
items = ["reflections", "water_waves", "water_clarity", "foam"]

[[pages]]
id = "atmosphere"
name = "Sky and weather"
description = "Fog, sky colour, wind, rain."
items = ["fog_amount", "sky_vibrance", "waving", "wave_strength", "wet_ground", "dimension_grade", "heat_haze"]

[[pages]]
id = "look"
name = "Picture"
description = "Colour, tone, bloom, anti-aliasing."
items = ["material_vibrance", "saturation", "contrast", "exposure", "tonemap", "bloom", "bloom_threshold", "sharpen", "vignette", "fxaa"]

[[options]]
id = "shadows"
name = "Shadows"
description = "Soft shadows cast by the sun and the moon."
type = "bool"
default = true

[[options]]
id = "shadow_samples"
name = "Shadow quality"
description = "More samples make softer, smoother shadow edges."
type = "choice"
values = ["Low", "Medium", "High"]
default = "Medium"

[[options]]
id = "shadow_softness"
name = "Shadow softness"
description = "How blurred shadow edges are."
type = "float"
default = 1.6
min = 0.5
max = 4.0
step = 0.1

[[options]]
id = "shadow_bias"
name = "Shadow bias"
description = "Raise it if surfaces show stripes of shadow on themselves."
type = "float"
default = 1.0
min = 0.4
max = 3.0
step = 0.1

[[options]]
id = "sun_strength"
name = "Sunlight"
description = "How strong direct sun and moon light is."
type = "float"
default = 1.0
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "ambient_strength"
name = "Sky light"
description = "How bright the shade is."
type = "float"
default = 1.0
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "block_light_strength"
name = "Torch light"
description = "How bright torches, lava and other light blocks are."
type = "float"
default = 1.0
min = 0.5
max = 1.6
step = 0.05

[[options]]
id = "colored_lights"
name = "Coloured lights"
description = "Soul fire is blue, redstone red, glowstone gold..."
type = "bool"
default = true

[[options]]
id = "reflections"
name = "Water reflections"
description = "Water mirrors the world and the sky."
type = "bool"
default = true

[[options]]
id = "water_waves"
name = "Waves"
description = "How strongly the water surface ripples."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "water_clarity"
name = "Water clarity"
description = "Higher is clearer; lower turns deep water dark sooner."
type = "float"
default = 1.0
min = 0.4
max = 2.0
step = 0.1

[[options]]
id = "foam"
name = "Shore foam"
description = "White foam where water meets the shore."
type = "bool"
default = true

[[options]]
id = "fog_amount"
name = "Fog"
description = "How hazy the distance is."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "sky_vibrance"
name = "Sky colour"
description = "How saturated the sky is."
type = "float"
default = 1.0
min = 0.6
max = 1.5
step = 0.05

[[options]]
id = "waving"
name = "Wind"
description = "Plants and leaves sway and water swells."
type = "bool"
default = true

[[options]]
id = "wave_strength"
name = "Wind strength"
description = "How far things move in the wind."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1

[[options]]
id = "wet_ground"
name = "Wet surfaces"
description = "Blocks darken in the rain."
type = "bool"
default = true

[[options]]
id = "material_vibrance"
name = "Block colour"
description = "Saturation of the block textures."
type = "float"
default = 1.12
min = 0.8
max = 1.5
step = 0.02

[[options]]
id = "saturation"
name = "Saturation"
description = "How colourful the picture is."
type = "float"
default = 1.08
min = 0.6
max = 1.6
step = 0.02

[[options]]
id = "contrast"
name = "Contrast"
description = "Difference between dark and bright."
type = "float"
default = 1.05
min = 0.8
max = 1.3
step = 0.01

[[options]]
id = "exposure"
name = "Exposure"
description = "Overall brightness."
type = "float"
default = 1.0
min = 0.6
max = 1.6
step = 0.02

[[options]]
id = "tonemap"
name = "Tone mapping"
description = "How bright colours roll off: Soft keeps hues, Filmic is punchier."
type = "choice"
values = ["Off", "Soft", "Filmic"]
default = "Soft"

[[options]]
id = "bloom"
name = "Bloom"
description = "The soft halo around bright things."
type = "float"
default = 0.5
min = 0.0
max = 1.5
step = 0.05

[[options]]
id = "bloom_threshold"
name = "Bloom threshold"
description = "How bright something must be to glow."
type = "float"
default = 0.9
min = 0.5
max = 1.5
step = 0.05

[[options]]
id = "sharpen"
name = "Sharpen"
description = "Crispness of block detail."
type = "float"
default = 0.3
min = 0.0
max = 1.0
step = 0.05

[[options]]
id = "vignette"
name = "Vignette"
description = "Slightly darker screen corners."
type = "bool"
default = true

[[options]]
id = "fxaa"
name = "Anti-aliasing"
description = "Smooth jagged edges (FXAA)."
type = "bool"
default = true

[[options]]
id = "dimension_grade"
name = "Nether and End look"
description = "Their own colour grade: warm and hazy in the Nether, cold violet in the End."
type = "bool"
default = true

[[options]]
id = "heat_haze"
name = "Nether heat haze"
description = "How much the Nether's air shimmers."
type = "float"
default = 1.0
min = 0.0
max = 2.0
step = 0.1
